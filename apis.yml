name: AbleTo
description: 'AbleTo is a virtual behavioral health company delivering structured, evidence-based
  cognitive behavioral therapy and coaching programs for anxiety, depression, and stress, typically
  delivered through health insurance benefits. Founded in 2008 and acquired by Optum (UnitedHealth
  Group) in 2020, AbleTo now operates as part of Optum Behavioral Care; its www.ableto.com domain
  301-redirects to optumbhcare.com. Originally backed by Bain Capital Ventures, the company is
  patient-facing and publishes no public developer API, SDK, developer portal, or OpenAPI. This
  profile is maintained in the API Evangelist network for portfolio and market tracking.'
